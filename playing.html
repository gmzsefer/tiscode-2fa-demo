<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TISCODE</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; margin: 0;
    }
    .kart {
      background: white; padding: 40px; border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 360px; text-align: center;
    }
    h1 { color: #764ba2; margin-bottom: 8px; }
    p { color: #888; font-size: 14px; }
    .wave {
      font-size: 20px; color: #764ba2;
      margin: 15px 0; animation: pulse 1s infinite;
      white-space: nowrap; overflow: hidden;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    audio { width: 100%; margin: 15px 0; }
    .status { color: #f59e0b; font-weight: bold; margin-top: 10px; }
    .retry { display: inline-block; margin-top: 12px; color: #764ba2; font-size: 13px; }
    .fail { display: inline-block; margin-top: 12px; color: #c62828; font-size: 13px; }
  </style>
</head>
<body>
  <div class="kart">
    <h1>🔊 Playing TISCODE...</h1>
    <p>Your computer is playing the sound. Your phone will hear it.</p>
    <div class="wave">▁▂▃▅▇▅▃▂▁▂▃▅▇▅▃▂▁</div>
    <audio id="clip" src="SOUND_URL" autoplay controls preload="auto"></audio>
    <p>TISCODE <b>SOUND_NAME</b> · length <b>DUR s</b> · attempt <b>ATTEMPT</b></p>
    <p class="status">📡 Waiting for your phone...</p>
    <div id="acks"></div>
    <a class="retry" id="retrybtn" href="/retry">🔁 Not recognized — play again (attempt +1)</a><br>
    <a class="fail" id="failbtn" href="/fail">❌ Phone didn't react (log as failed)</a>
  </div>

  <script>
    // Start the timer only when the sound really starts (download time excluded)
    document.getElementById("clip").addEventListener("playing",
      () => fetch("/started", {method: "POST"}), {once: true});
    let names = [];
    // Ask the server every second: has the phone confirmed?
    setInterval(async () => {
      const r = await fetch("/status");
      const d = await r.json();
      if ("MODE" === "all") {        // simultaneous test: no redirect, list the phones that confirmed
        const list = Object.entries(d.acks);
        document.getElementById("acks").innerHTML = list.length
          ? list.map(([dev, t]) => `<p>✅ ${dev.split(" | ")[0] || dev} <b>${t}s</b></p>`).join("")
          : "";
        names = list.map(([dev]) => dev.split(" | ")[0]);
      } else if (d.confirmed) {
        location.href = "/success";   // confirmed -> success page
      }
    }, 1000);
    if ("MODE" === "all") {
      const b = document.getElementById("failbtn");
      b.textContent = "⏹ Finish — next sound (phones that didn't react = failed)";
      document.getElementById("retrybtn").style.display = "none";
      // Auto mode: go on by itself when every phone confirmed, or 35 s after the sound started
      // (25 s for 1-2 s clips: late taps are rejected by the server, see register_ack)
      let auto = true, left = null, done = false;
      const next = () => { if (auto && !done) { done = true; location.href = "/fail?next=1"; } };
      const info = document.createElement("p");
      const stop = document.createElement("a");
      stop.href = "#"; stop.className = "retry"; stop.textContent = "⏸ Stop auto mode";
      stop.onclick = e => { e.preventDefault(); auto = false; info.textContent = "Auto mode off"; stop.remove(); };
      b.after(info, stop);
      document.getElementById("clip").addEventListener("playing", () => { left = DUR <= 2 ? 25 : 35; }, {once: true});
      setInterval(() => {
        if (!auto) return;
        if (PHONE_NAMES.every(n => names.includes(n))) { setTimeout(next, 1500); return; }
        if (left === null) return;
        info.textContent = `Next sound in ${left} s`;
        if (--left < 0) next();
      }, 1000);
    }
</script>
</body>
</html>
